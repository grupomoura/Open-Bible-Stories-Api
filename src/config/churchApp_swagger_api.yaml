openapi: 3.0.0
info:
  title: ChurchApp
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
tags:
  - name: Authentication
  - name: API
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: create
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: >-
                "{\n        \"email\": \"jamesarcanjo@email.com\",\n       
                \"password\": \"minhasenha123\"\n}"
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '201':
          description: Created
          headers:
            X-Powered-By:
              schema:
                type: string
                example: Express
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '*'
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Content-Length:
              schema:
                type: integer
                example: '411'
            ETag:
              schema:
                type: string
                example: W/"19b-HIUhEpyc8leZ8OM6+58M7UZHXag"
            Date:
              schema:
                type: string
                example: Fri, 18 Oct 2024 20:23:56 GMT
            Connection:
              schema:
                type: string
                example: keep-alive
            Keep-Alive:
              schema:
                type: string
                example: timeout=5
          content:
            application/json:
              schema:
                type: object
              example:
                message: Usuário criado com sucesso
                data:
                  id: 43
                  order: '12.00000000000000000000'
                  UUID: 658dd780-a27a-4183-851c-b3118e4aa048
                  email: jamesarcanjo@email.com
                  password: >-
                    7ZeYqOp4brsF2W1DD4bin4f+7V+hjCW4ZJHggUZwmvXkefLeB7PP5d/izvqLktmErfr/C77CiYQ+GJxPcNKy2w==
                  Active: false
                  Created on: '2024-10-18T20:23:56.426808Z'
                  Last modified: '2024-10-18T20:23:56.426808Z'
                  salt: jxNDZuWdLCy6cdVLbvN53A==
  /auth/login:
    post:
      tags:
        - Authentication
      summary: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: jamesarcanjo@email.com
                password: minhasenha123
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer
      responses:
        '200':
          description: OK
          headers:
            X-Powered-By:
              schema:
                type: string
                example: Express
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '*'
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Content-Length:
              schema:
                type: integer
                example: '276'
            ETag:
              schema:
                type: string
                example: W/"114-+pOEiL7xEbpdB3hCJK+gV2hqK2s"
            Date:
              schema:
                type: string
                example: Fri, 18 Oct 2024 20:26:17 GMT
            Connection:
              schema:
                type: string
                example: keep-alive
            Keep-Alive:
              schema:
                type: string
                example: timeout=5
          content:
            application/json:
              schema:
                type: object
              example:
                message: Login bem-sucedido
                token: >-
                  eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6NDMsImVtYWlsIjoiamFtZXNhcmNhbmpvQGVtYWlsLmNvbSIsImlhdCI6MTcyOTI4MzE3NywiZXhwIjoxNzI5Mjg2Nzc3fQ.oHP91XrDnllf2CRBCZb_fFaFcd4BGqDOvMHAmvL-Mko
                user:
                  id: 43
                  email: jamesarcanjo@email.com
  /cartoonStories:
    get:
      tags:
        - API
      summary: cartoonStories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cartoonStories/1:
    get:
      tags:
        - API
      summary: cartoonStories/{id}
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /videosOverview:
